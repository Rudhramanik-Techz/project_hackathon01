# No secrets here. Credentials come from your AWS CLI profile (AWS_PROFILE=asli).
version = 0.1

[default.global.parameters]
stack_name = "asli-ya-nakli"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
s3_prefix = "asli-ya-nakli"
